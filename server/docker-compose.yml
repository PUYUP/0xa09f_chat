name: a09f

# a09f server: Ergo (IRC server with built-in accounts, rooms, always-on
# clients and history) + PostgreSQL (Ergo history, account service data) +
# the account service (Go, server/api) + Mailpit (dev email).
#
# Secrets come from .env (see .env.example; scripts/init-env.sh fills in the
# random ones).

# Reusable logging config: cap docker json-file logs so they can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  a09f:
    driver: bridge
    ipam:
      config:
        - subnet: ${A09F_SUBNET:-172.30.98.0/24}

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    container_name: a09f-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      # Read by initdb/01-roles.sh to create the ergo and a09f roles + databases.
      ERGO_DB_PASSWORD: ${ERGO_DB_PASSWORD:?run scripts/init-env.sh}
      A09F_DB_PASSWORD: ${A09F_DB_PASSWORD:?run scripts/init-env.sh}
    # Insert-heavy chat history; durability is not traded away.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      a09f:
        ipv4_address: 172.30.98.40

  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1
    container_name: a09f-ergo
    restart: unless-stopped
    environment:
      ERGO__DATASTORE__POSTGRESQL__PASSWORD: ${ERGO_DB_PASSWORD}
      ERGO__API__BEARER_TOKENS: '["${ERGO_API_TOKEN:?run scripts/init-env.sh}"]'
      ERGO__ACCOUNTS__JWT_AUTH__TOKENS: '[{"algorithm": "hmac", "key": "${JWT_KEY:?run scripts/init-env.sh}", "account-claims": ["preferred_username"]}]'
    # Self-signed TLS certificates are made on first start (ergo mkcerts).
    entrypoint: ["/bin/sh", "-c", "mkdir -p /ircd/db /ircd/tls && /ircd-bin/ergo mkcerts --conf /ircd/etc/ircd.yaml >/dev/null && exec /ircd-bin/ergo run --conf /ircd/etc/ircd.yaml"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${IRC_PORT:-16667}:6667"          # IRC plaintext (the app)
      - "${BIND_ADDR:-127.0.0.1}:${IRC_TLS_PORT:-16697}:6697"      # IRC over TLS (self-signed)
    volumes:
      - ./ergo/ircd.yaml:/ircd/etc/ircd.yaml:ro
      - ./ergo/motd:/ircd/etc/motd:ro
      - ergo-data:/ircd/db
      - ergo-tls:/ircd/tls
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6667"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      a09f:
        ipv4_address: 172.30.98.10

  # Account service (Go): accounts, friends, live events (SSE), message
  # extras, rooms/people data. Talks to Ergo over its HTTP API and IRC.
  api:
    build:
      context: ./api
    image: a09f-api:latest
    container_name: a09f-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://a09f:${A09F_DB_PASSWORD}@postgres:5432/a09f?sslmode=disable
      HISTORY_DATABASE_URL: postgres://a09f:${A09F_DB_PASSWORD}@postgres:5432/ergo_history?sslmode=disable
      ERGO_API: http://ergo:8089
      ERGO_API_TOKEN: ${ERGO_API_TOKEN}
      ERGO_IRC: ergo:6667
      JWT_KEY: ${JWT_KEY}
      ADMIN_USERS: ${ADMIN_USERS:-}           # comma-separated IDs allowed to send announcements
      # Password-reset email. Defaults deliver to the local Mailpit catcher;
      # point these at a real SMTP server in production.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}   # starttls | ssl | none
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-a09f <no-reply@a09f.invalid>}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-16680}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ergo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/a09f-api", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      a09f:
        ipv4_address: 172.30.98.50

  # Development mail catcher: the api sends password-reset emails here.
  # Read them at http://127.0.0.1:16825. Not needed with a real SMTP_HOST.
  mailpit:
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68  # v1.27
    container_name: a09f-mailpit
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_PORT:-16825}:8025"     # web inbox
    logging: *default-logging
    networks:
      a09f:
        ipv4_address: 172.30.98.60

volumes:
  postgres-data:
  ergo-data:
  ergo-tls:
