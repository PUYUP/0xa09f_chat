name: irc

# Reusable logging config: cap docker json-file logs so they can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  ircnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${IRC_SUBNET:-172.30.99.0/24}

services:
  solanum:
    build:
      context: ./solanum
      args:
        SOLANUM_COMMIT: ${SOLANUM_COMMIT:-92afd03482ae6b0df1c5ba1d6b8886d2d626dbf3}
    image: solanum-local:latest
    container_name: solanum
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SOLANUM_PORT:-6667}:6667"        # IRC plaintext
      - "${BIND_ADDR:-127.0.0.1}:${SOLANUM_TLS_PORT:-6697}:6697"    # IRC over TLS (self-signed)
    volumes:
      - ./solanum/etc:/etc/solanum:ro
      - ./solanum/etc/motd:/usr/local/etc/ircd.motd:ro
      - solanum-logs:/var/log/solanum
      - solanum-state:/var/local                # bandb ban.db (/var/local/ban.db)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6667"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.10

  atheme:
    image: s0fx2/atheme-irc-services@sha256:29f42d1e01ae198e21f80867e0b7924297f5edfa9c5b532c4d0dae4a8461523b
    container_name: atheme
    restart: unless-stopped
    env_file: .env
    entrypoint: /render-entrypoint.sh
    volumes:
      - ./atheme/etc:/atheme/etc
      - ./atheme/entrypoint.sh:/render-entrypoint.sh:ro
      - atheme-data:/atheme/var
    depends_on:
      solanum:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f atheme-services >/dev/null && nc -z solanum 6667"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.20

  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    # Modest tuning for a bouncer workload: message history is insert-heavy.
    # synchronous_commit stays at default (on) — durability is not traded away.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.40

  soju:
    image: codeberg.org/emersion/soju@sha256:c695fb996dce168fb39449415c7523b17189ed81b48c107d4728fc93fb30e799
    container_name: soju
    restart: unless-stopped
    environment:
      # lib/pq reads PGPASSWORD for the postgres:// connection in soju/config
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SOJU_PORT:-16667}:6667"          # bouncer plaintext
      - "${BIND_ADDR:-127.0.0.1}:${SOJU_TLS_PORT:-16697}:6697"      # bouncer TLS (self-signed)
    volumes:
      - ./soju/config:/soju-config:ro
      - ./soju:/soju-tls:ro
      - soju-db:/db
      - soju-uploads:/uploads
    depends_on:
      solanum:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/sojuctl", "-config", "/soju-config", "server", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.30

  # a09f account service (Go, server/api): Create account, password reset,
  # friends, live events (SSE), message extras, rooms/people data. Creates
  # soju users + their upstream network through soju's admin socket (soju-db).
  # Its data is in postgres (database a09f, see scripts/init-api-db.sh); data
  # of the old Python service (register-data/register.db) is imported once.
  api:
    build:
      context: ./api
    image: a09f-api-soju:latest
    container_name: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://a09f:${A09F_DB_PASSWORD:?run scripts/init-api-db.sh}@postgres:5432/a09f?sslmode=disable
      LEGACY_SQLITE: /data/register.db        # Python service data, read once (never changed)
      UPSTREAM_ADDR: irc+insecure://solanum:6667
      NETWORK_NAME: ${SOJU_NETWORK:-solanum}
      SOJU_IRC: soju:6667
      ADMIN_USERS: ${ADMIN_USERS:-}           # comma-separated IDs allowed to send announcements
      # Password-reset email. Defaults deliver to the local Mailpit catcher;
      # point these at a real SMTP server in production.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}   # starttls | ssl | none
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-a09f <no-reply@a09f.invalid>}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REGISTER_PORT:-16680}:8080"    # account service (HTTP + live events)
    volumes:
      - ./soju/config:/soju-config:ro
      - soju-db:/db
      - register-data:/data:ro
    depends_on:
      soju:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/a09f-api", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.50

  # Development mail catcher: the api sends password-reset emails here.
  # Read them at http://127.0.0.1:16825. Not needed with a real SMTP_HOST.
  mailpit:
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68  # v1.27
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_PORT:-16825}:8025"     # web inbox
    logging: *default-logging
    networks:
      ircnet:
        ipv4_address: 172.30.99.60

volumes:
  postgres-data:
  soju-db:
  soju-uploads:
  register-data:
  atheme-data:
  solanum-logs:
  solanum-state:
