<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolNet</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #262637; --border: #3a3a55;
    --fg: #cdd6f4; --dim: #a6adc8; --accent: #89b4fa;
    --me: #a6e3a1; --other: #cdd6f4; --service: #f9e2af;
    --error: #f38ba8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, "SF Mono", Menlo, monospace; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header .title { font-weight: 700; color: var(--accent); margin-right: 8px; }
  input[type=text], input[type=password] { background: #1e1e2e; border: 1px solid var(--border); color: var(--fg); padding: 5px 8px; border-radius: 4px; font: inherit; }
  button { background: var(--accent); border: 0; color: #11111b; padding: 5px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #f38ba8; display: inline-block; }
  #dot.on { background: #a6e3a1; }
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #side h3, #users h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 10px 12px 4px; }
  #channels, #users { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  .chan, .user { padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan:hover, .user:hover { background: #34344a; }
  .chan.active { background: #313244; color: var(--accent); }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .msg { margin: 2px 0; word-break: break-word; }
  .msg .who { color: var(--dim); }
  .msg .txt { color: var(--fg); }
  .msg.me .who { color: var(--me); }
  .msg.me .txt { color: var(--me); }
  .msg.service .who { color: var(--service); }
  .msg.action .txt { font-style: italic; color: var(--dim); }
  .msg.error .txt { color: var(--error); }
  #composer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  #composer input { flex: 1; }
  #right { width: 200px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  #statusbar { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--dim); }
  .row { display: flex; gap: 6px; align-items: center; padding: 8px 12px; }
  .row label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  details { border-top: 1px solid var(--border); }
  summary { padding: 8px 12px; cursor: pointer; color: var(--dim); font-size: 12px; }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; padding: 0 12px 10px; }
  .kv input { width: 100%; }
</style>
</head>
<body>
<header>
  <span class="title">SolNet</span>
  <span id="dot"></span>
  <input type="text" id="addr" value="127.0.0.1:16667" size="16" title="bouncer address">
  <button id="btnConnect">Connect</button>
  <span id="who" style="color:var(--dim)"></span>
  <span style="flex:1"></span>
  <button class="ghost" id="btnAway" disabled>Set away</button>
</header>
<main>
  <div id="side">
    <h3>Channels</h3>
    <div id="channels"></div>
    <div class="row">
      <input type="text" id="newChan" placeholder="#new-channel" style="flex:1">
      <button id="btnJoin" disabled>Join</button>
    </div>
    <details>
      <summary>Bouncer account</summary>
      <div class="kv">
        <label>user</label><input type="text" id="buser" value="pointilis">
        <label>password</label><input type="password" id="bpass" value="change-me">
        <label>network</label><input type="text" id="bnet" value="solanum">
      </div>
    </details>
    <details>
      <summary>NickServ register</summary>
      <div class="kv">
        <label>password</label><input type="password" id="nsPass" placeholder="new nickserv password">
        <label>email</label><input type="text" id="nsEmail" placeholder="you@example.com">
        <label></label><button id="btnRegister" disabled>Register</button>
      </div>
    </details>
  </div>
  <div id="center">
    <div id="log"></div>
    <div id="composer">
      <input type="text" id="input" placeholder="message — /join #chan to switch" disabled>
      <button id="btnSend" disabled>Send</button>
    </div>
  </div>
  <div id="right">
    <h3 id="usersTitle">Users</h3>
    <div id="users"></div>
  </div>
</main>
<div id="statusbar">disconnected</div>
<script src="app.js"></script>
</body>
</html>
