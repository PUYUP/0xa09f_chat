[package]
name = "a09f-desktop"
version = "0.1.0"
edition = "2021"
description = "a09f desktop client (Solanum + Atheme + Soju)"
license = "MIT"

[lib]
name = "a09f_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"          # open links from messages in the system browser
tauri-plugin-deep-link = "2"       # a09f://join/<room> invite links
# "Remember my password": stored in the OS keychain, never in a file.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
