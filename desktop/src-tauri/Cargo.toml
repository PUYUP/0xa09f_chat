[package]
name = "a09f-desktop"
version = "0.1.0"
edition = "2021"
description = "a09f desktop client (Solanum + Atheme + Soju)"
license = "MIT"

[lib]
name = "a09f_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
